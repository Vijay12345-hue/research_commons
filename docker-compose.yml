
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: research_commons_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: research_commons
      POSTGRES_USER: research_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - research_commons_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_user -d research_commons"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: research_commons_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - research_commons_minio_data:/data

volumes:
  research_commons_data:
  research_commons_minio_data:
